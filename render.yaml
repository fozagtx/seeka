services:
  - type: web
    name: seeka
    runtime: node
    buildCommand: "bun install"
    startCommand: "bun run index.ts"
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
